<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="700" viewBox="0 0 1030 700" role="img" aria-label="Secções axiais dos eletrodos de DBS">
<defs>
  <linearGradient id="metxs" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2B3441"/>
    <stop offset="32%" stop-color="#6B7787"/>
    <stop offset="58%" stop-color="#39424F"/>
    <stop offset="100%" stop-color="#2B3441"/>
  </linearGradient>
  <linearGradient id="shfxs" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#D7DBE1"/>
    <stop offset="35%" stop-color="#FBFCFD"/>
    <stop offset="100%" stop-color="#D2D7DE"/>
  </linearGradient>
  <marker id="arxs" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
  </marker>
</defs>
<rect width="1030" height="700" fill="#FFFFFF"/>
<text x="40.0" y="48.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#101828" text-anchor="start" >Secção axial: contato anelar × nível segmentado</text>
<text x="40.0" y="74.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475467" text-anchor="start" >Eletrodos de DBS da Medtronic — geometria transversal e convenção de orientação</text>
<line x1="40" y1="98" x2="990" y2="98" stroke="#D0D5DD" stroke-width="1"/>
<circle cx="210.0" cy="262.0" r="88.0" fill="url(#shfxs)" stroke="#98A2B3" stroke-width="1.4"/>
<circle cx="210.0" cy="262.0" r="88.0" fill="none" stroke="#2B3441" stroke-width="15.0"/>
<circle cx="210.0" cy="262.0" r="33.4" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1" stroke-dasharray="4 4"/>
<text x="210.0" y="266.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#667085" text-anchor="middle" >lúmen</text>
<text x="210.0" y="410.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#101828" text-anchor="middle" >Níveis 0 e 3 — anelares</text>
<text x="210.0" y="432.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475467" text-anchor="middle" >contato circunferencial de 360°</text>
<circle cx="515.0" cy="262.0" r="88.0" fill="url(#shfxs)" stroke="#98A2B3" stroke-width="1.4"/>
<path d="M 447.6 205.4 A 88.0 88.0 0 0 1 582.4 205.4" fill="none" stroke="#2B3441" stroke-width="15.0" stroke-linecap="butt"/>
<text x="515.0" y="150.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B3441" text-anchor="middle" >a</text>
<path d="M 499.7 348.7 A 88.0 88.0 0 0 1 432.3 231.9" fill="none" stroke="#2B3441" stroke-width="15.0" stroke-linecap="butt"/>
<text x="412.8" y="327.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B3441" text-anchor="middle" >b</text>
<path d="M 597.7 231.9 A 88.0 88.0 0 0 1 530.3 348.7" fill="none" stroke="#2B3441" stroke-width="15.0" stroke-linecap="butt"/>
<text x="617.2" y="327.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B3441" text-anchor="middle" >c</text>
<line x1="515.0" y1="262.0" x2="515.0" y2="190.0" stroke="#667085" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="515.0" y1="262.0" x2="452.6" y2="298.0" stroke="#667085" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="515.0" y1="262.0" x2="577.4" y2="298.0" stroke="#667085" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M 515.0 218.0 A 44 44 0 0 1 553.1 284.0" fill="none" stroke="#667085" stroke-width="1.2" marker-start="url(#arxs)" marker-end="url(#arxs)"/>
<text x="565.0" y="246.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475467" text-anchor="start" >120°</text>
<text x="515.0" y="410.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#101828" text-anchor="middle" >Níveis 1 e 2 — segmentados</text>
<text x="515.0" y="432.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475467" text-anchor="middle" >três segmentos de ~120° · vista a partir da</text>
<text x="515.0" y="452.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475467" text-anchor="middle" >extremidade proximal (a → b → c anti-horário)</text>
<circle cx="830.0" cy="262.0" r="78.0" fill="none" stroke="#D0D5DD" stroke-width="1.4"/>
<line x1="830.0" y1="194.0" x2="830.0" y2="184.0" stroke="#667085" stroke-width="1.4"/>
<text x="830.0" y="168.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475467" text-anchor="middle" >0° anterior</text>
<line x1="898.0" y1="262.0" x2="908.0" y2="262.0" stroke="#667085" stroke-width="1.4"/>
<text x="928.0" y="266.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475467" text-anchor="start" >90°</text>
<line x1="830.0" y1="330.0" x2="830.0" y2="340.0" stroke="#667085" stroke-width="1.4"/>
<text x="830.0" y="364.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475467" text-anchor="middle" >180° posterior</text>
<line x1="762.0" y1="262.0" x2="752.0" y2="262.0" stroke="#667085" stroke-width="1.4"/>
<text x="732.0" y="266.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475467" text-anchor="end" >270°</text>
<path d="M 830.0 216.0 A 46 46 0 0 1 876.0 262.0" fill="none" stroke="#B4471F" stroke-width="1.8" marker-end="url(#arxs)"/>
<text x="830.0" y="268.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#B4471F" text-anchor="middle" >horário</text>
<text x="830.0" y="410.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#101828" text-anchor="middle" >Convenção em incidência AP</text>
<text x="830.0" y="432.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475467" text-anchor="middle" >ângulo do marcador de orientação proximal</text>
<line x1="40" y1="460" x2="990" y2="460" stroke="#D0D5DD" stroke-width="1"/>
<text x="40.0" y="484.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#667085" text-anchor="start" >•</text>
<text x="56.0" y="484.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475467" text-anchor="start" >Nos eletrodos anelares (3387, 3389, 3391) todos os contatos são anéis de 360°: o campo é radialmente simétrico.</text>
<text x="40.0" y="505.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#667085" text-anchor="start" >•</text>
<text x="56.0" y="505.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475467" text-anchor="start" >Nos direcionais SenSight (B33005/B33015) os níveis 1 e 2 são divididos em três segmentos isolados entre si, o que</text>
<text x="40.0" y="526.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#667085" text-anchor="start" >•</text>
<text x="56.0" y="526.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475467" text-anchor="start" >permite direcionar o campo e ampliar a janela terapêutica; ativar os três segmentos juntos reproduz um anel.</text>
<text x="40.0" y="547.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#667085" text-anchor="start" >•</text>
<text x="56.0" y="547.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475467" text-anchor="start" >Os arcos e as frestas de isolamento são aproximados — o parâmetro do fabricante é a separação de 120° entre os</text>
<text x="40.0" y="568.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#667085" text-anchor="start" >•</text>
<text x="56.0" y="568.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475467" text-anchor="start" >centros dos segmentos. A ordem a → b → c é anti-horária quando vista da extremidade proximal do eletrodo.</text>
<text x="40.0" y="589.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#667085" text-anchor="start" >•</text>
<text x="56.0" y="589.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475467" text-anchor="start" >A orientação in vivo é estimada por TC/radiografia a partir dos marcadores (algoritmos tipo DiODe) e deve ser</text>
<text x="40.0" y="610.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#667085" text-anchor="start" >•</text>
<text x="56.0" y="610.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475467" text-anchor="start" >documentada em incidência AP no intraoperatório, conforme o manual de implante.</text>
</svg>