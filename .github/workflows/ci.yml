name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    name: Suíte JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Gerar dataset sintético
        run: node tools/gerar_exemplo.mjs examples

      - name: Reconstruir index.html a partir dos fontes
        working-directory: src
        run: node build.mjs

      - name: Verificar que o bundle está sincronizado com src/
        run: git diff --exit-code -- index.html
          || (echo "::error::index.html está dessincronizado. Rode 'cd src && node build.mjs' e faça commit." && exit 1)

      - name: Rodar a suíte
        run: node tests/run.mjs

      - name: Benchmark quantitativo (falha se houver regressão de desempenho)
        run: node tests/benchmark.mjs --out benchmark --check

      - name: Publicar a tabela de desempenho no resumo do job
        if: always()
        run: cat benchmark/resultados.md >> "$GITHUB_STEP_SUMMARY"

  r:
    name: Sintaxe do script R
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: 'release' }
      - name: Verificar que o script é parseável e carrega
        run: |
          Rscript -e 'invisible(parse("R/percept_lfp.R")); cat("parse OK\n")'
          Rscript -e 'invisible(parse("R/tidal_dt.R")); cat("parse tidal_dt OK\n")'
          Rscript -e 'install.packages(c("jsonlite","ggplot2"), repos="https://cloud.r-project.org")'
          Rscript -e 'source("R/percept_lfp.R"); cat("source OK —", length(ls()), "objetos\n")'
          Rscript -e 'source("R/tidal_dt.R"); cat("source tidal_dt OK —", length(ls()), "objetos\n")'

      # Critério de aceite do TIDAL-DT: o self-test sintético no app (JS) e o
      # MESMO dataset no R (gerador determinístico espelhado) devem propor
      # limiares que divergem menos de 2%.
      - name: Validação cruzada TIDAL-DT (JS × R, aceite < 2%)
        run: |
          node --input-type=module -e 'import {TIDAL} from "./src/core/metrics/tidal.js"; const s=TIDAL.selfTest(); if(!s.pass){console.error("self-test JS falhou", JSON.stringify(s.proposed));process.exit(1);} console.log(s.proposed.lower+" "+s.proposed.upper);' > /tmp/js_thresh.txt
          cat /tmp/js_thresh.txt
          Rscript -e 'try(install.packages("mclust", repos="https://cloud.r-project.org"), silent=TRUE)'
          Rscript -e 'source("R/tidal_dt.R"); st <- tidal_selftest(); js <- scan("/tmp/js_thresh.txt", quiet=TRUE); r <- c(st$res$proposal$lower, st$res$proposal$upper); div <- 100*abs(r-js)/js; cat(sprintf("JS %d/%d · R %d/%d · divergencia %.2f%% / %.2f%%\n", js[1], js[2], r[1], r[2], div[1], div[2])); stopifnot(all(div < 2))'
      - name: Executar sobre o dataset sintético
        run: |
          Rscript -e 'source("R/percept_lfp.R")' -e 'p <- percept_read("examples/exemplo_sintetico.json"); print(p)' \
                  -e 'tr <- percept_trend(p); stopifnot(nrow(tr) > 1000)' \
                  -e 'r <- pipeline_circadiano(tr, "Right"); print(r$tabela)'
        continue-on-error: true
